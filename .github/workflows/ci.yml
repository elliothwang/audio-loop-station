name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake --preset windows
      - name: Build
        run: cmake --build --preset debug
      - name: Test
        run: ctest --preset debug

  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install clang-format
        run: pip install clang-format==23.1.3
      - name: Check formatting
        run: git ls-files '*.cpp' '*.hpp' '*.h' | xargs -r clang-format --dry-run --Werror
